name: pytest

on:
  push

env:
  IMAGE: nikolaik/python-nodejs:python3.15-nodejs26

jobs:
  run:
    name: Tests

    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v6
        with:
          path: venv
          key: venv-test-${{ env.IMAGE }}-${{ hashFiles('requirements.txt', 'test-requirements.txt') }}

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install -r test-requirements.txt

      - name: Run pytest
        run: |
          venv/bin/python -m pytest -vv
