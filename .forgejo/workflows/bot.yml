name: ApplSec bot

on:
  schedule:
    # weekends: every hour
    - cron: "TZ=Europe/Ljubljana 0 * * * 0,6"
    # weekdays 18:00 to 22:00: run every 15 minutes as that is the time when updates usually get released
    - cron: "TZ=Europe/Ljubljana */15 18-21 * * 1-5"
    # weekdays outside the release window: every hour
    - cron: "TZ=Europe/Ljubljana 0 0-17,22-23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: applsec-bot
  cancel-in-progress: false

env:
  IMAGE: nikolaik/python-nodejs:python3.15-nodejs26

jobs:
  run:
    runs-on: ubuntu-latest
    container:
      image: ${{ env.IMAGE }}
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main

      - name: Checkout posted_data_json
        uses: actions/checkout@v7
        with:
          ref: posted_data_json
          path: branch

      - name: Set up posted_data.json
        run: |
          cp branch/posted_data.json main/src/

      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v6
        with:
          path: venv
          key: venv-${{ env.IMAGE }}-${{ hashFiles('main/requirements.txt') }}

      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          venv/bin/pip install -r main/requirements.txt

      - name: Check timezone
        run: date

      - name: Run ApplSec bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

          TWITTER_API_KEY_TEST: ${{ secrets.TWITTER_API_KEY_TEST }}
          TWITTER_API_KEY_SECRET_TEST: ${{ secrets.TWITTER_API_KEY_SECRET_TEST }}
          TWITTER_ACCESS_TOKEN_TEST: ${{ secrets.TWITTER_ACCESS_TOKEN_TEST }}
          TWITTER_ACCESS_TOKEN_SECRET_TEST: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET_TEST }}

          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

          MASTODON_ACCESS_TOKEN_TEST: ${{ secrets.MASTODON_ACCESS_TOKEN_TEST }}

          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          venv/bin/python main/src/main.py

      - name: Save posted_data.json
        if: always()
        working-directory: branch
        run: |
          cp ../main/src/posted_data.json .

          if [[ $(git status --porcelain) ]]; then
            git config user.name "forgejo-actions"
            git config user.email "noreply@forgejo.org"

            git add .
            git commit -m "$(date +'%Y-%m-%d %I:%M:%S %p %z')"
            git push
          fi
